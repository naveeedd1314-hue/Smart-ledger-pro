name: SmartLedger Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate PWA manifest and service worker
        run: |
          node --check public/sw.js
          node --input-type=module -e "import fs from 'node:fs'; const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8')); if (!manifest.name || !manifest.start_url || !Array.isArray(manifest.icons) || !manifest.icons.length) throw new Error('Invalid PWA manifest'); for (const icon of manifest.icons) if (!fs.existsSync('public' + icon.src)) throw new Error('Missing PWA icon: ' + icon.src)"
      - name: TypeScript and Vite production build
        run: npm run build
      - name: ESLint code quality check
        run: npm run lint
