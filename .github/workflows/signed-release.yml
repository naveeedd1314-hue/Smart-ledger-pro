name: Signed Android Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing credentials are configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for Android signing: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @capacitor/core @capacitor/android @capacitor/cli @capacitor/app @capacitor/assets firebase

      - name: Build production web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0D332D' --splashBackgroundColor '#0D332D'

      - name: Install native hardware Back handler
        run: |
          mkdir -p android/app/src/main/java/com/srenterprises/smartledger
          cat > android/app/src/main/java/com/srenterprises/smartledger/MainActivity.java <<'EOF'
          package com.srenterprises.smartledger;
          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript("window.dispatchEvent(new Event('smartledger:native-back'))", null);
                          }
                      }
                  });
              }
          }
          EOF

      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartledger-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/smartledger-release.jks" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Expected generated android/app/build.gradle was not found")
          s = p.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          pattern = r"(buildTypes\\s*\\{\\s*release\\s*\\{)"
          s2, count = re.subn(pattern, r"\\1\n            signingConfig signingConfigs.release", s, count=1)
          if count != 1:
              raise SystemExit("Could not safely attach release signing config to generated Gradle build")
          p.write_text(s2)
          PY

      - name: Sync native project
        run: npx cap sync android

      - name: Build signed APK and Play Store bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload signed production files
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Pro-Signed-Production
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
