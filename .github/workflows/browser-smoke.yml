name: SmartLedger Pro browser smoke tests
# Post-deploy verification for current main build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright xlsx
          npx playwright install --with-deps chromium
      - name: Test deployed app at mobile, tablet and desktop sizes
        env:
          APP_URL: https://naveeedd1314-hue.github.io/Smart-ledger-pro/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const sizes = [
            {name:'small Android',width:360,height:800},
            {name:'Android phone',width:412,height:915},
            {name:'tablet',width:768,height:1024},
            {name:'desktop',width:1365,height:900},
          ];
          const failures = [];
          for (const size of sizes) {
            const context = await browser.newContext({viewport:{width:size.width,height:size.height},isMobile:size.width<600,hasTouch:size.width<600});
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            try {
              await page.goto(process.env.APP_URL,{waitUntil:'networkidle',timeout:60000});
              await page.getByRole('button',{name:'Continue in offline mode'}).click({timeout:20000});
              await page.locator('[data-sl-dashboard="true"]').waitFor({state:'visible',timeout:20000});
              await page.waitForTimeout(700);
              const state = await page.evaluate(() => {
                const root=document.documentElement, body=document.body;
                const dashboard=document.querySelector('[data-sl-dashboard]');
                const main=dashboard?.querySelector(':scope > main');
                const sidebar=dashboard?.querySelector(':scope > aside');
                const charts=[...document.querySelectorAll('.sl-chart-card')];
                const style=getComputedStyle(dashboard);
                return {
                  title:document.title,
                  viewport:innerWidth,
                  documentWidth:root.scrollWidth,
                  bodyHeight:body.scrollHeight,
                  viewportHeight:innerHeight,
                  dashboard:!!dashboard,
                  main:!!main,
                  sidebar:!!sidebar,
                  chartCount:charts.length,
                  bg:style.getPropertyValue('--bg').trim(),
                  surface:style.getPropertyValue('--surface').trim(),
                };
              });
              if(!state.dashboard||!state.main||!state.sidebar) throw new Error('Dashboard shell or navigation missing');
              if(state.documentWidth>size.width+2) throw new Error('Unexpected horizontal page overflow: '+state.documentWidth+'px');
              if(!state.bg||!state.surface) throw new Error('Theme tokens missing');
              if(state.chartCount!==4) throw new Error('Expected four dashboard charts, found '+state.chartCount);
              // Exercise vertical page scrolling in both directions.
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(100);
              const pageReachedBottom = await page.evaluate(() => window.scrollY > 0);
              await page.evaluate(() => window.scrollTo(0, 0));
              if (state.bodyHeight > state.viewportHeight && !pageReachedBottom) throw new Error('Main page did not scroll vertically');

              // Exercise the sidebar's own scroll container.
              const sidebarNav = page.locator('[data-sl-dashboard] aside nav');
              const sidebarScroll = await sidebarNav.evaluate(el => {
                const before = el.scrollTop;
                el.scrollTop = el.scrollHeight;
                const reached = el.scrollTop > before;
                el.scrollTop = 0;
                return {scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,reached};
              });
              if (sidebarScroll.scrollHeight > sidebarScroll.clientHeight && !sidebarScroll.reached) throw new Error('Sidebar navigation did not scroll');

              // On touch-enabled mobile emulation, send real Chromium touch input
              // through CDP (not synthetic DOM events) and verify native scrolling.
              // Visit every primary module without creating or changing business records.
              const modules=['Command Centre','Analytics','Sales','Purchases','Inventory','Bulk Items','Customers','Suppliers','Expenses','Payments','Reports','Ledger','Returns','GST & Tax','Settings'];
              for (const moduleName of modules) {
                if (size.width < 768) {
                  const menuButton=page.getByRole('button',{name:'Open navigation menu'});
                  if (await menuButton.isVisible()) await menuButton.click();
                }
                await page.locator('[data-sl-dashboard] aside nav').getByRole('button',{name:moduleName}).click();
                await page.waitForFunction(name => location.hash === '#page='+encodeURIComponent(name),moduleName,{timeout:10000});
                const moduleState=await page.evaluate(()=>{
                  const root=document.querySelector('[data-sl-dashboard="true"]');
                  const main=root?.querySelector('main');
                  return {root:!!root,main:!!main,text:main?.innerText?.trim()||'',children:main?.children?.length||0,body:document.body.innerText.slice(0,900)};
                });
                if(!moduleState.root || !moduleState.main || !moduleState.children || !moduleState.text) throw new Error(moduleName+' did not render app shell/content: '+JSON.stringify(moduleState)+' runtime='+pageErrors.join(' | '));
                if(pageErrors.length) throw new Error(moduleName+' triggered browser errors: '+pageErrors.join(' | '));
                console.log('MODULE PASS '+size.name+' '+moduleName);
              }
              // End-to-end Excel import coverage: create real BIFF8 .xls and .xlsx files,
              // upload through the app UI, apply, and verify persisted inventory + audit history.
              if (size.width === 412) {
                const XLSX = (await import('xlsx')).default;
                const nav = page.locator('[data-sl-dashboard] aside nav');
                await nav.getByRole('button',{name:'Bulk Items'}).evaluate(el=>el.click());
                await page.waitForFunction(() => location.hash === '#page=Bulk%20Items');
                const makeWorkbook = (rows) => {
                  const wb=XLSX.utils.book_new();
                  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Stock Summary');
                  return wb;
                };
                const upload = async (extension, rows) => {
                  const wb=makeWorkbook(rows);
                  const buffer=XLSX.write(wb,{type:'buffer',bookType:extension==='xls'?'biff8':'xlsx'});
                  await page.locator('input[type=file]').setInputFiles({
                    name:'inventory-test.'+extension,
                    mimeType:extension==='xls'?'application/vnd.ms-excel':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    buffer,
                  });
                  await page.getByText(/1 products read from inventory-test\./).waitFor({timeout:15000});
                  await page.getByRole('button',{name:'Apply import'}).click();
                };
                const headers=['Product Name','Barcode / SKU','Category','HSN Code','GST Rate','Purchase Price','Average Cost','Wholesale Price','Selling Price','Opening Stock'];
                await upload('xls',[['Stock Summary Report'],headers,['Test Notebook XLS','SLTEST-001','Stationery','4820','12','20','20','22','25','12']]);
                let imported=await page.evaluate(()=>JSON.parse(localStorage.getItem('smartledger-products')||'[]'));
                let item=imported.find(p=>p.sku==='SLTEST-001');
                if(!item||item.name!=='Test Notebook XLS'||Number(item.stock)!==12||Number(item.purchase)!==20||Number(item.selling)!==25) throw new Error('Legacy .xls import did not persist expected product fields. Stored products='+JSON.stringify(imported)+' UI message='+await page.locator('[data-sl-page=true]').innerText().then(t=>t.slice(0,1800)));
                const originalId=item.id;
                await upload('xlsx',[['Inventory Export'],headers,['Test Notebook XLS Updated','SLTEST-001','Stationery','4820','5','22','22','25','29','18']]);
                imported=await page.evaluate(()=>({products:JSON.parse(localStorage.getItem('smartledger-products')||'[]'),history:JSON.parse(localStorage.getItem('smartledger-pro-price-history')||'[]'),stock:JSON.parse(localStorage.getItem('smartledger-pro-stock-adjustments')||'[]')}));
                item=imported.products.find(p=>p.sku==='SLTEST-001');
                if(!item||String(item.id)!==String(originalId)||item.name!=='Test Notebook XLS Updated'||Number(item.stock)!==18||Number(item.purchase)!==22||Number(item.selling)!==29) throw new Error('.xlsx SKU update did not preserve identity or update fields: '+JSON.stringify(item));
                if(!imported.history.some(x=>x.productId===originalId&&x.field==='purchase'&&Number(x.newPrice)===22)) throw new Error('.xlsx price change was not written to price history');
                if(!imported.stock.some(x=>x.productId===originalId&&Number(x.change)===12)||!imported.stock.some(x=>x.productId===originalId&&Number(x.change)===6)) throw new Error('Excel import stock movements were not audited');
                await upload('xlsx',[['Product Name','Barcode / SKU','Selling Price'],['Test Notebook XLS Updated','SLTEST-001','31']]);
                imported=await page.evaluate(()=>JSON.parse(localStorage.getItem('smartledger-products')||'[]'));
                item=imported.find(p=>p.sku==='SLTEST-001');
                if(!item||Number(item.selling)!==31||Number(item.purchase)!==22||Number(item.stock)!==18||item.category!=='Stationery'||item.hsn!=='4820'||Number(item.gstRate)!==5) throw new Error('Import without optional columns erased existing stock, cost, category, HSN or GST fields: '+JSON.stringify(item));
                console.log('PASS Excel import: BIFF8 .xls create, .xlsx SKU update, optional-column preservation, ID, price and stock audit logs');
              }

              if (size.width < 768) {
                const menuButton=page.getByRole('button',{name:'Open navigation menu'});
                if (await menuButton.isVisible()) await menuButton.click();
              }
              await page.locator('[data-sl-dashboard] aside nav').getByRole('button',{name:'Dashboard'}).click();
              await page.waitForFunction(() => location.hash === '#page=Dashboard');
              // Confirm the in-app back control returns to the previous module.
              if (size.width < 768) await page.getByRole('button',{name:'Open navigation menu'}).click();
              await page.locator('[data-sl-dashboard] aside nav').getByRole('button',{name:'Inventory'}).click();
              await page.getByRole('button',{name:'Back to previous screen'}).click();
              await page.waitForFunction(() => location.hash === '#page=Dashboard');

              // Exercise chart detail and both outstanding-party detail dialogs.
              await page.getByRole('button',{name:'Expand Monthly business performance details'}).evaluate(el=>el.click());
              const chartDialog=page.getByRole('dialog',{name:'Monthly business performance full details'});
              await chartDialog.waitFor({state:'visible',timeout:10000});
              await chartDialog.getByRole('button',{name:'Close'}).click();
              await page.getByRole('button',{name:'Open full customer outstanding details'}).evaluate(el=>el.click());
              const customerDialog=page.getByRole('dialog',{name:'Customer outstanding details'});
              await customerDialog.waitFor({state:'visible',timeout:10000});
              await customerDialog.getByRole('button',{name:'Close'}).click();
              await page.getByRole('button',{name:'Open full supplier outstanding details'}).evaluate(el=>el.click());
              const supplierDialog=page.getByRole('dialog',{name:'Supplier outstanding details'});
              await supplierDialog.waitFor({state:'visible',timeout:10000});
              await supplierDialog.getByRole('button',{name:'Close'}).click();
              // Validate discounted customer gross profit and return reversal using isolated fixture data.
              if (size.width === 412) {
                await page.evaluate(() => {
                  localStorage.setItem('smartledger-pro-customers',JSON.stringify([{id:'profit-customer',name:'Margin Test Customer',opening:0}]));
                  localStorage.setItem('smartledger-pro-sales',JSON.stringify([{id:'profit-sale',invoice:'MARGIN-001',date:'2026-11-24',customer:'Margin Test Customer',product:'Test Notebook',qty:2,rate:100,discountAmount:20,taxableValue:180,total:201.6,paid:0,purchasePrice:60}]));
                  localStorage.setItem('smartledger-pro-returns',JSON.stringify([{id:'profit-return',originalId:'profit-sale',type:'Sales Return',invoice:'MARGIN-001',party:'Margin Test Customer',product:'Test Notebook',qty:1,rate:100,amount:90,taxAmount:10,totalAmount:100,purchasePrice:60,date:'2026-11-24',reason:'Test'}]));
                  localStorage.setItem('smartledger-pro-expenses','[]');
                  localStorage.setItem('smartledger-pro-payments','[]');
                });
                const nav=page.locator('[data-sl-dashboard] aside nav');
                await nav.getByRole('button',{name:'Ledger'}).evaluate(el=>el.click());
                await page.waitForFunction(()=>location.hash==='#page=Ledger');
                await page.locator('select').first().selectOption({label:'Margin Test Customer'});
                const profitCard=page.getByText('Gross profit before expenses').locator('..');
                await profitCard.waitFor({state:'visible'});
                if(!(await profitCard.innerText()).includes('₹30')) throw new Error('Customer ledger did not apply discounted net revenue and costed return reversal: '+await profitCard.innerText());
                await nav.getByRole('button',{name:'Reports'}).evaluate(el=>el.click());
                await page.waitForFunction(()=>location.hash==='#page=Reports');
                const reportProfit=page.getByText('Gross Profit',{exact:true}).locator('..');
                if(!(await reportProfit.innerText()).includes('₹30')) throw new Error('Financial report gross profit did not match expected ₹30: '+await reportProfit.innerText());
                await page.locator('[data-sl-dashboard] aside nav').getByRole('button',{name:'Dashboard'}).evaluate(el=>el.click());
                await page.waitForFunction(()=>location.hash==='#page=Dashboard');
              }
              // Verify both theme modes, actual card/chart text contrast and AI panel visibility.
              const themeButton = page.getByRole('button',{name:'Toggle colour theme'});
              const beforeTheme = await page.locator('html').getAttribute('data-theme');
              await themeButton.click();
              const afterTheme = await page.locator('html').getAttribute('data-theme');
              if (beforeTheme === afterTheme || !['light','dark'].includes(afterTheme)) throw new Error('Theme toggle did not change theme');
              if(afterTheme==='dark'){
                const darkState=await page.evaluate(()=>{
                  const card=document.querySelector('.sl-metric-card');
                  const cardText=card?.querySelector('p');
                  const tick=document.querySelector('.recharts-cartesian-axis-tick-value');
                  const cs=card?getComputedStyle(card):null;
                  return {cardBg:cs?.backgroundColor,cardText:cardText?getComputedStyle(cardText).color:'',tick:tick?getComputedStyle(tick).fill:'',theme:document.documentElement.dataset.theme};
                });
                if(!darkState.cardBg||darkState.cardBg===darkState.cardText||darkState.tick==='rgb(0, 0, 0)') throw new Error('Dark dashboard card or chart labels are not readable: '+JSON.stringify(darkState));
                await page.getByRole('button',{name:'Open SmartLedger AI'}).click();
                const aiPanel=page.locator('section[style*="position: fixed"]');
                await aiPanel.waitFor({state:'visible'});
                const aiColors=await aiPanel.evaluate(el=>({bg:getComputedStyle(el).backgroundColor,text:getComputedStyle(el).color,content:el.innerText}));
                if(aiColors.bg===aiColors.text||!aiColors.content.includes('Automatic business review')) throw new Error('Dark-mode SmartLedger AI panel is not readable: '+JSON.stringify(aiColors));
              }
              await themeButton.click();
              const restoredTheme = await page.locator('html').getAttribute('data-theme');
              if (restoredTheme !== beforeTheme) throw new Error('Theme toggle did not restore original theme');

              if(pageErrors.length) throw new Error('Browser runtime errors: '+pageErrors.join(' | '));
              console.log('PASS '+size.name+' '+JSON.stringify({...state,pageReachedBottom,sidebarScroll,navigation:'PASS',themeToggle:'PASS'}));
            } catch(error) {
              failures.push(size.name+': '+error.message);
              console.error('FAIL '+size.name+' '+error.message);
            }
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('All responsive browser smoke tests passed.');
          EOF
