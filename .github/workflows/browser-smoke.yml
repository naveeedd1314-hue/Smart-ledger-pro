name: SmartLedger Pro browser smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test deployed app at mobile, tablet and desktop sizes
        env:
          APP_URL: https://naveeedd1314-hue.github.io/Smart-ledger-pro/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const sizes = [
            {name:'small Android',width:360,height:800},
            {name:'Android phone',width:412,height:915},
            {name:'tablet',width:768,height:1024},
            {name:'desktop',width:1365,height:900},
          ];
          const failures = [];
          for (const size of sizes) {
            const context = await browser.newContext({viewport:{width:size.width,height:size.height},isMobile:size.width<600,hasTouch:size.width<600});
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            try {
              await page.goto(process.env.APP_URL,{waitUntil:'networkidle',timeout:60000});
              await page.getByRole('button',{name:'Continue in offline mode'}).click({timeout:20000});
              await page.locator('[data-sl-dashboard="true"]').waitFor({state:'visible',timeout:20000});
              await page.waitForTimeout(700);
              const state = await page.evaluate(() => {
                const root=document.documentElement, body=document.body;
                const dashboard=document.querySelector('[data-sl-dashboard]');
                const main=dashboard?.querySelector(':scope > main');
                const sidebar=dashboard?.querySelector(':scope > aside');
                const charts=[...document.querySelectorAll('.sl-chart-card')];
                const style=getComputedStyle(dashboard);
                return {
                  title:document.title,
                  viewport:innerWidth,
                  documentWidth:root.scrollWidth,
                  bodyHeight:body.scrollHeight,
                  viewportHeight:innerHeight,
                  dashboard:!!dashboard,
                  main:!!main,
                  sidebar:!!sidebar,
                  chartCount:charts.length,
                  bg:style.getPropertyValue('--bg').trim(),
                  surface:style.getPropertyValue('--surface').trim(),
                };
              });
              if(!state.dashboard||!state.main||!state.sidebar) throw new Error('Dashboard shell or navigation missing');
              if(state.documentWidth>size.width+2) throw new Error('Unexpected horizontal page overflow: '+state.documentWidth+'px');
              if(!state.bg||!state.surface) throw new Error('Theme tokens missing');
              if(state.chartCount!==4) throw new Error('Expected four dashboard charts, found '+state.chartCount);
              // Exercise vertical page scrolling in both directions.
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(100);
              const pageReachedBottom = await page.evaluate(() => window.scrollY > 0);
              await page.evaluate(() => window.scrollTo(0, 0));
              if (state.bodyHeight > state.viewportHeight && !pageReachedBottom) throw new Error('Main page did not scroll vertically');

              // Exercise the sidebar's own scroll container.
              const sidebarNav = page.locator('[data-sl-dashboard] aside nav');
              const sidebarScroll = await sidebarNav.evaluate(el => {
                const before = el.scrollTop;
                el.scrollTop = el.scrollHeight;
                const reached = el.scrollTop > before;
                el.scrollTop = 0;
                return {scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,reached};
              });
              if (sidebarScroll.scrollHeight > sidebarScroll.clientHeight && !sidebarScroll.reached) throw new Error('Sidebar navigation did not scroll');

              // On touch-enabled mobile emulation, send real Chromium touch input
              // through CDP (not synthetic DOM events) and verify native scrolling.
              if (size.width < 600) {
                const cdp = await context.newCDPSession(page);
                const swipe = async (x, yStart, yEnd) => {
                  await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y:yStart}]});
                  for (let step=1; step<=5; step++) {
                    const y=yStart+(yEnd-yStart)*step/5;
                    await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y}]});
                    await page.waitForTimeout(25);
                  }
                  await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
                  await page.waitForTimeout(250);
                };
                await swipe(Math.round(size.width/2),size.height-110,Math.round(size.height/3));
                const touchPageScroll=await page.evaluate(()=>window.scrollY);
                if(state.bodyHeight>state.viewportHeight && touchPageScroll<=0) throw new Error('Touch swipe did not scroll the page');
                await page.evaluate(()=>window.scrollTo(0,0));
                await page.getByRole('button',{name:'Open navigation menu'}).click();
                const navBox=await page.locator('[data-sl-dashboard] aside nav').boundingBox();
                if(navBox && sidebarScroll.scrollHeight>sidebarScroll.clientHeight) {
                  await swipe(Math.round(navBox.x+navBox.width/2),Math.round(navBox.y+navBox.height-35),Math.round(navBox.y+35));
                  const touchSidebarScroll=await sidebarNav.evaluate(el=>el.scrollTop);
                  if(touchSidebarScroll<=0) throw new Error('Touch swipe did not scroll the sidebar');
                }
                await cdp.detach();
              }

              // Verify app navigation and the in-app back control.
              if (size.width < 768) {
                const menuButton=page.getByRole('button',{name:'Open navigation menu'});
                if(await menuButton.isVisible()) await menuButton.click();
                else await page.getByRole('button',{name:'Open navigation menu'}).click();
              }
              await page.locator('[data-sl-dashboard] aside nav').getByRole('button',{name:'Inventory'}).click();
              await page.getByRole('heading',{name:'Inventory'}).waitFor({state:'visible',timeout:10000});
              await page.getByRole('button',{name:'Back to previous screen'}).click();
              await page.getByRole('heading',{name:'Dashboard'}).waitFor({state:'visible',timeout:10000});

              // Verify both theme modes update tokens and restore the original setting.
              const themeButton = page.getByRole('button',{name:'Toggle colour theme'});
              const beforeTheme = await page.locator('html').getAttribute('data-theme');
              await themeButton.click();
              const afterTheme = await page.locator('html').getAttribute('data-theme');
              if (beforeTheme === afterTheme || !['light','dark'].includes(afterTheme)) throw new Error('Theme toggle did not change theme');
              await themeButton.click();
              const restoredTheme = await page.locator('html').getAttribute('data-theme');
              if (restoredTheme !== beforeTheme) throw new Error('Theme toggle did not restore original theme');

              if(pageErrors.length) throw new Error('Browser runtime errors: '+pageErrors.join(' | '));
              console.log('PASS '+size.name+' '+JSON.stringify({...state,pageReachedBottom,sidebarScroll,navigation:'PASS',themeToggle:'PASS'}));
            } catch(error) {
              failures.push(size.name+': '+error.message);
              console.error('FAIL '+size.name+' '+error.message);
            }
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('All responsive browser smoke tests passed.');
          EOF
