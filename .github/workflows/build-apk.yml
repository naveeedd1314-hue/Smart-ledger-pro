name: Build SmartLedger Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.ts'
      - '.env.production'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli @capacitor/app @capacitor/assets firebase
      - name: Build web app
        run: npm run build
      - name: Verify Firebase configuration is bundled
        run: |
          node -e "const fs=require('fs');const path=require('path');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);const files=walk('dist').filter(f=>f.endsWith('.js'));const bundle=files.map(f=>fs.readFileSync(f,'utf8')).join('\\n');for(const value of ['smart-ledger-pro-2e75d.firebaseapp.com','smart-ledger-pro-2e75d']){if(!bundle.includes(value)){console.error('Missing Firebase config value:',value);process.exit(1)}}console.log('Firebase project configuration is present in the production bundle.')"
      - name: Generate Android project
        run: npx cap add android
      - name: Generate premium Android app icon and splash
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0D332D' --splashBackgroundColor '#0D332D'
      - name: Install native hardware Back handler
        run: |
          mkdir -p android/app/src/main/java/com/srenterprises/smartledger
          cat > android/app/src/main/java/com/srenterprises/smartledger/MainActivity.java <<'EOF'
          package com.srenterprises.smartledger;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Register after Capacitor plugins so this callback receives Back first.
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "window.dispatchEvent(new Event('smartledger:native-back'))",
                                  null
                              );
                          }
                      }
                  });
              }
          }
          EOF
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
